<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Девять вопросов о прибыли, продвижении и сделках. Интерактивная презентация Авито.">
  <title>Авито · Предпринимательский блиц</title>
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
  <link rel="preload" href="./assets/fonts/CoFoAvitoDisplay-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="./assets/fonts/CoFoAvitoDisplay-Medium.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="./styles.css?v=type-7">
  <script src="./app.js?v=type-7" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a href="#" class="brand" aria-label="Авито — к вопросам"><img src="./assets/avito-logo.svg?v=copy-6" width="142" height="36" alt="Авито"></a>
      <p class="event-title"><strong>Предпринимательский блиц:</strong> как не платить за ошибки в продажах</p>
      <div class="tools">
        <button class="tool-button" id="reset-button" aria-label="Начать заново" title="Начать заново" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9a8 8 0 1 1 0 6M4 4v5h5"/></svg><span>Начать заново</span>
        </button>
        <button class="tool-button fullscreen-button" id="fullscreen-button" aria-label="На весь экран" title="На весь экран (F)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m6 0h5v-5"/></svg><span>На весь экран</span>
        </button>
      </div>
    </header>
    <main id="main-content"></main>
  </div>
  <dialog id="reset-dialog" aria-labelledby="reset-title" aria-describedby="reset-description">
    <form method="dialog">
      <h2 id="reset-title">Начнём заново?</h2>
      <p id="reset-description">Все отметки ответов будут сняты.</p>
      <div class="dialog-actions"><button value="cancel" class="button button-secondary" autofocus>Продолжить</button><button value="reset" class="button button-primary">Сбросить отметки</button></div>
    </form>
  </dialog>
  <div id="announcement" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <noscript><p class="noscript">Для выбора вопросов включите JavaScript в браузере.</p></noscript>
</body>
</html>
